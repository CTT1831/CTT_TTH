<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập Thu Chi V7</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2fa;min-height:100vh;display:grid;place-items:center;padding:16px;color:#1b2c4b}.card{width:min(440px,100%);background:#fff;padding:25px;border-radius:22px;box-shadow:0 15px 50px #24344a19}h1{font-size:25px}input,button{font:inherit;width:100%;padding:13px;border-radius:12px;margin:8px 0}input{border:1px solid #cbd5e5}button{border:0;background:#3155ae;color:white;font-weight:700}.secondary{background:#edf2fa;color:#3155ae}.muted{color:#66758c;font-size:13px;line-height:1.6}#msg{color:#bb3344;white-space:pre-wrap;font-size:14px}</style></head><body><div class="card"><h1>☁️ Thu Chi V7</h1><p class="muted">Đăng nhập bằng email để đồng bộ thu chi, sổ nợ và To-do List giữa điện thoại và máy tính.</p><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="ban@gmail.com"><label>Mật khẩu</label><input id="password" type="password" minlength="8" required autocomplete="current-password" placeholder="Ít nhất 8 ký tự"><button id="login" type="submit">Đăng nhập</button></form><button id="signup" class="secondary">Tạo tài khoản</button><div id="msg" role="status"></div><p class="muted">Bạn cần cấu hình file <code>config.js</code> và chạy <code>schema.sql</code> trên Supabase trước. Không cần nhập mật khẩu tài khoản GitHub.</p></div><script src="./config.js"></script><script src="./cloud.js"></script><script>const $=id=>document.getElementById(id);const msg=t=>$('msg').textContent=t;async function begin(mode){let email=$('email').value.trim(),password=$('password').value; if(!email||password.length<8){msg('Vui lòng nhập email và mật khẩu ít nhất 8 ký tự');return}try{msg('Đang kết nối…');const result=await cloud.auth(mode,email,password);if(mode==='signup'&&!result.access_token){msg('Đã gửi email xác thực (nếu bật xác nhận email). Hãy xác nhận rồi đăng nhập.');return}await cloud.activate(result,email);msg('Đang lấy dữ liệu từ đám mây…');await cloud.bootstrap();location.replace('./index.html')}catch(e){msg('Không đăng nhập được: '+e.message)}}$('f').onsubmit=e=>{e.preventDefault();begin('login')};$('signup').onclick=()=>begin('signup');</script></body></html>
