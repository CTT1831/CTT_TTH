<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu • Thu Chi</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2fa;min-height:100vh;display:grid;place-items:center;padding:16px;color:#192d4b}.card{width:min(440px,100%);padding:26px;background:#fff;border-radius:22px;box-shadow:0 12px 40px #24344a18}input,button{font:inherit;width:100%;padding:13px;border-radius:12px;margin:9px 0}input{border:1px solid #bbc9e1}button{border:0;background:#3155ae;color:white;font-weight:700}#msg{white-space:pre-wrap;color:#a02b42}</style></head><body><div class="card"><h2>🔑 Đặt lại mật khẩu</h2><p>Nhập mật khẩu mới từ 8 ký tự trở lên.</p><form id="form"><input type="password" id="pw" minlength="8" required autocomplete="new-password" placeholder="Mật khẩu mới"><input type="password" id="confirm" minlength="8" required autocomplete="new-password" placeholder="Nhập lại mật khẩu"><button>Đổi mật khẩu</button></form><p id="msg"></p><a href="./login.html">← Quay lại đăng nhập</a></div><script src="./config.js"></script><script src="./cloud.js"></script><script>const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);const token=hash.get('access_token');const $=id=>document.getElementById(id);if(hash.get('error_description')||query.get('error_description'))$('msg').textContent=decodeURIComponent(hash.get('error_description')||query.get('error_description'));else if(!token)$('msg').textContent='Liên kết không hợp lệ hoặc đã hết hạn. Hãy yêu cầu gửi lại email.';$('form').onsubmit=async e=>{e.preventDefault();if(!token){$('msg').textContent='Không có mã xác thực đặt lại mật khẩu';return}if($('pw').value!==$('confirm').value){$('msg').textContent='Hai mật khẩu chưa giống nhau';return}try{$('msg').textContent='Đang đổi mật khẩu…';await cloud.resetPassword($('pw').value,token);history.replaceState({},'',location.pathname);$('msg').textContent='✅ Đổi mật khẩu thành công. Hãy quay lại đăng nhập.';$('form').reset()}catch(err){$('msg').textContent='Không thể đổi mật khẩu: '+err.message}};</script></body></html>
